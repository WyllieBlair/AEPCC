<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Australian Porsche Cup Championship</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #e1e7ec; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: auto; }
    nav { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #232733; padding-bottom: 15px; }
    nav a { color: #8892b0; text-decoration: none; font-weight: 600; }
    nav a:hover { color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #161b26; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #232733; }
    th { background: #1f2637; color: #a5b4fc; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
    .badge-ban { background: #e11d48; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-ok { background: #10b981; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
    h2 { margin-top: 40px; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="#">Live Standings</a>
      <a href="https://forms.google.com/your-form-link" target="_blank">Submit Protest ↗</a>
    </nav>

    <h2>Driver Standings</h2>
    <table>
      <thead>
        <tr>
          <th>Pos</th>
          <th>Driver</th>
          <th>Class</th>
          <th>Net Pts</th>
          <th>License Pts</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="driver-board">
        <tr><td colspan="6">Loading standings...</td></tr>
      </tbody>
    </table>

    <h2>Team Standings</h2>
    <table>
      <thead>
        <tr>
          <th>Pos</th>
          <th>Team</th>
          <th>Total Points</th>
        </tr>
      </thead>
      <tbody id="team-board">
        <tr><td colspan="3">Loading standings...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Load the script to fetch data -->
  <script src="app.js"></script>
</body>
</html>
